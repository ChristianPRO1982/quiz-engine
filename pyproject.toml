[project]
name = "quiz-engine"
version = "1.0.0"
description = "Lightweight quiz engine with FastAPI and WebSockets."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "jinja2>=3.1",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "python-semantic-release>=10.5.3",
    "ruff>=0.14.13",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
branch = "main"
commit_message = "chore(release): v{version}"
commit_author = "github-actions <github-actions@github.com>"

[tool.semantic_release.changelog]
mode = "update"

