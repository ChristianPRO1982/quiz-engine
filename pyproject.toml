[project]
name = "quiz-engine"
version = "1.0.1"
description = "Live quiz engine (FastAPI + WebSocket) for small groups."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.112",
  "jinja2>=3.1",
  "pillow>=10.4",
  "qrcode>=7.4",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "coverage>=7.0",
  "python-semantic-release>=9.0",
  "httpx>=0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
tag_format = "v{version}"
branch = "main"
commit_message = "chore(release): v{version}"
commit_author = "github-actions <github-actions@github.com>"
