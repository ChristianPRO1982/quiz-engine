services:
  traefik:
    image: traefik:v3.0
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yaml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --api.insecure=true
    ports:
      - "${TRAEFIK_HTTP_PORT:-80}:80"
      - "${TRAEFIK_HTTPS_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - ./traefik_dynamic.yml:/etc/traefik/dynamic.yaml:ro

  quiz-engine:
    build: .
    env_file:
      - .env
    labels:
      - traefik.enable=true
      - traefik.http.routers.quizengine.rule=Host(`quiz-engine.localhost`)
      - traefik.http.routers.quizengine.entrypoints=websecure
      - traefik.http.routers.quizengine.tls=true
      - traefik.http.services.quizengine.loadbalancer.server.port=8000
