services:
  quiz-engine:
    container_name: quiz-engine
    build: .
    restart: unless-stopped

    # for DEV
    ports:
      - "8000:8000"

    env_file:
      - .env

    # Required on Linux so DB_HOST=host.docker.internal resolves from container.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    command:
      - /bin/sh
      - -ec
      - |
        export DATABASE_URL="${DB_SCHEME}://${DB_USER}:$(cat /run/secrets/qe_password.txt)@${DB_HOST}:${DB_PORT}/${DB_NAME}"
        exec /app/.venv/bin/uvicorn quiz_engine.app:app --host 0.0.0.0 --port 8000 --proxy-headers

    secrets:
      - source: qe_password
        target: qe_password.txt

    networks:
      - proxy
      - backend

    labels:
      - traefik.enable=true

      # Router
      - traefik.http.routers.quiz-engine.rule=Host(`quiz-engine.localhost`)
      - traefik.http.routers.quiz-engine.entrypoints=websecure
      - traefik.http.routers.quiz-engine.tls=true

      # Service
      - traefik.http.services.quiz-engine.loadbalancer.server.port=8000

networks:
  proxy:
    external: true
  backend:
    external: true

secrets:
  qe_password:
    file: ${DB_PASSWORD_FILE_HOST}
