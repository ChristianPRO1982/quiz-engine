services:
  traefik:
    image: traefik:v3.0
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --api.insecure=true
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  quiz-engine:
    build: .
    labels:
      - traefik.enable=true
      - traefik.http.routers.quizengine.rule=Host(`quiz-engine.localhost`)
      - traefik.http.routers.quizengine.entrypoints=websecure
      - traefik.http.routers.quizengine.tls=true
      - traefik.http.services.quizengine.loadbalancer.server.port=8000
