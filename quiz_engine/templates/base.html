<!doctype html>
<html lang="{{ locale or 'en' }}" data-theme="normal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Quiz Engine{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/themes/normal.css" />
    <link rel="stylesheet" href="/static/css/themes/scout.css" />
    <link rel="stylesheet" href="/static/css/tokens/quiz-tokens.css" />
    <link rel="stylesheet" href="/static/css/apps/quiz.css" />
  </head>
  {% set show_chrome = show_admin_chrome if show_admin_chrome is defined else True %}
  <body class="qe-page{% if not show_chrome %} qe-page--preview{% endif %}">
    {% if show_chrome %}
      {% include "partials/auth_widget.html" %}
    {% endif %}
    {% if show_chrome and current_user %}
      {% include "partials/admin_nav.html" %}
    {% endif %}
    <main class="qe-shell{% if not show_chrome %} qe-shell--preview{% endif %}">
      {% block content %}{% endblock %}
    </main>
    <script src="/static/js/i18n.js"></script>
  </body>
</html>
