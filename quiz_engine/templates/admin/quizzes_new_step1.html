{% extends "base.html" %}
{% block title %}Create Quiz - Step 1{% endblock %}
{% block content %}
  <section class="qe-card">
    <p class="qe-meta">
      <span>Create quiz</span>
      <span class="qe-pill">Step 1/3</span>
    </p>
    <h1 class="qe-title">Quiz metadata</h1>
    <p class="qe-hint">Define the title and optional description.</p>
    {% if error %}
      <p class="qe-error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/quizzes/new" class="qe-form-grid">
      <label>
        <span>Title</span>
        <input type="text" name="title" value="{{ draft.title }}" required />
      </label>
      <label>
        <span>Description</span>
        <input
          type="text"
          name="description"
          value="{{ draft.description }}"
          placeholder="Optional"
        />
      </label>
      <div class="qe-actions">
        <a class="qe-btn" href="/admin/quizzes">Cancel</a>
        <button class="qe-btn qe-btn--primary" type="submit">Continue</button>
      </div>
    </form>
  </section>
{% endblock %}
