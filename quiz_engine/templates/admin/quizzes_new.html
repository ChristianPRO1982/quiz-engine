{% extends "base.html" %}
{% block title %}Create Quiz{% endblock %}
{% block content %}
  <section class="qe-card">
    <h1 class="qe-title">Create quiz</h1>
    <p class="qe-hint">MVP form: one single-choice question.</p>
    {% if error %}
      <p class="qe-error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/quizzes/new" class="qe-form-grid">
      <label>
        <span>Title</span>
        <input type="text" name="title" required />
      </label>
      <label>
        <span>Description</span>
        <input type="text" name="description" />
      </label>
      <label>
        <span>Question</span>
        <input type="text" name="question" required />
      </label>
      <label>
        <span>Choice 1</span>
        <input type="text" name="choice1" required />
      </label>
      <label>
        <span>Choice 2</span>
        <input type="text" name="choice2" required />
      </label>
      <label>
        <span>Choice 3</span>
        <input type="text" name="choice3" required />
      </label>
      <div class="qe-actions qe-actions--start">
        <button class="qe-btn qe-btn--primary" type="submit">Create</button>
      </div>
    </form>
  </section>
{% endblock %}
