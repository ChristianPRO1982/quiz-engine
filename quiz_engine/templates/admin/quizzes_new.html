{% extends "base.html" %}
{% block title %}{{ _("admin.new.page_title") }}{% endblock %}
{% block content %}
  <section class="qe-card">
    <h1 class="qe-title">{{ _("admin.new.heading") }}</h1>
    <p class="qe-hint">{{ _("admin.new.hint") }}</p>
    {% if error %}
      <p class="qe-error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/admin/quizzes/new" class="qe-form-grid">
      <label>
        <span>{{ _("common.title") }}</span>
        <input type="text" name="title" required />
      </label>
      <label>
        <span>{{ _("common.description") }}</span>
        <input type="text" name="description" />
      </label>
      <label>
        <span>{{ _("common.question") }}</span>
        <input type="text" name="question" required />
      </label>
      <label>
        <span>{{ _("admin.new.choice_1") }}</span>
        <input type="text" name="choice1" required />
      </label>
      <label>
        <span>{{ _("admin.new.choice_2") }}</span>
        <input type="text" name="choice2" required />
      </label>
      <label>
        <span>{{ _("admin.new.choice_3") }}</span>
        <input type="text" name="choice3" required />
      </label>
      <div class="qe-actions qe-actions--start">
        <button class="qe-btn qe-btn--primary" type="submit">{{ _("common.create") }}</button>
      </div>
    </form>
  </section>
{% endblock %}
