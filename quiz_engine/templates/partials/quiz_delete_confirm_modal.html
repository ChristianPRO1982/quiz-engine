<dialog id="qe-quiz-delete-modal" class="qe-modal">
  <form method="dialog" class="qe-modal__panel qe-modal__panel--confirm">
    <h2>Delete quiz?</h2>
    <p id="qe-quiz-delete-message">This action cannot be undone.</p>
    <menu class="qe-actions">
      <button class="qe-btn" id="qe-quiz-delete-cancel" type="button">Cancel</button>
      <button class="qe-btn qe-btn--danger" id="qe-quiz-delete-confirm" type="button">Delete</button>
    </menu>
  </form>
</dialog>
