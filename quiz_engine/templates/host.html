<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Engine Host</title>
    <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}" />
  </head>
  <body class="page">
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Sprint 0</p>
          <h1>Quiz Engine Host</h1>
          <p class="lead">Create a lobby, share the QR code, and start the session.</p>
        </div>
        <button id="create-session" class="btn primary">Create session</button>
      </section>

      <section id="session-panel" class="panel hidden">
        <div class="panel-header">
          <div>
            <p class="label">Session code</p>
            <p id="session-code" class="session-code">—</p>
          </div>
          <div class="state">
            <span class="label">State</span>
            <span id="session-state" class="state-value">LOBBY</span>
          </div>
        </div>

        <div class="grid">
          <div class="card">
            <p class="label">Join URL</p>
            <p id="join-url" class="mono">—</p>
            <img id="qr-image" class="qr" alt="Join QR code" />
          </div>
          <div class="card">
            <p class="label">Players</p>
            <ul id="player-list" class="players"></ul>
          </div>
        </div>

        <div class="controls">
          <button id="start-session" class="btn">Start</button>
          <button id="end-session" class="btn danger">End</button>
        </div>
        <p id="status" class="status">Idle.</p>
      </section>
    </main>

    <script src="{{ url_for('static', path='host.js') }}"></script>
  </body>
</html>
