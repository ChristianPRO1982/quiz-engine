{% extends "base.html" %}
{% block title %}{{ _("home.page.title") }}{% endblock %}
{% block content %}
  <section class="qe-card">
    <p class="qe-meta">
      <span>{{ _("home.meta.product") }}</span>
      {% if is_dev %}
        <span class="qe-pill qe-pill--dev">{{ _("home.badge.dev") }}</span>
      {% endif %}
    </p>
    <h1 class="qe-title">{{ _("home.page.heading") }}</h1>
    <p class="qe-hint">{{ _("home.page.lead") }}</p>
  </section>
{% endblock %}
