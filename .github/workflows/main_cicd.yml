name: main-ci-cd

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write

concurrency:
  group: main-cicd-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test_pr:
    name: Pytest (PR dev -> main)
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.base_ref == 'main' &&
      github.head_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (uv)
        run: uv sync --frozen --dev

      - name: Pytest
        env:
          PYTHONPATH: .
        run: uv run pytest -q

  release:
    name: Release (merge dev -> main)
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.base_ref == 'main' &&
      github.head_ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (uv)
        run: uv sync --frozen --dev

      - name: Pytest (safety)
        env:
          PYTHONPATH: .
        run: uv run pytest -q

      - name: Read version from pyproject.toml
        id: version
        shell: bash
        run: |
          VERSION="$(python -c "import tomllib; from pathlib import Path; data=tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8')); v=(data.get('project') or {}).get('version'); assert v, 'Missing [project].version in pyproject.toml'; print(v)")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
