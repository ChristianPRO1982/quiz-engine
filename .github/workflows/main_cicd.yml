name: main-ci-cd

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  contents: write

jobs:
  test:
    name: Run tests (PR dev -> main)
    if: >
      github.event_name == 'pull_request' &&
      github.event.action != 'closed' &&
      github.base_ref == 'main' &&
      github.head_ref == 'dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (uv)
        run: uv sync --frozen --dev

      - name: Run pytest
        run: uv run pytest -q

  release:
    name: Release (when PR dev -> main is merged)
    needs: test
    if: >
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.base_ref == 'main' &&
      github.head_ref == 'dev' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (uv)
        run: uv sync --frozen --dev

      - name: Run pytest (safety)
        run: uv run pytest -q

      - name: Read version from pyproject.toml
        id: version
        shell: bash
        run: |
          python - << 'PY'
          import sys
          try:
              import tomllib  # py3.11+
          except ModuleNotFoundError:
              import tomli as tomllib  # fallback
          from pathlib import Path

          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = (data.get("project", {}) or {}).get("version")
          if not version:
              print("Missing project.version in pyproject.toml", file=sys.stderr)
              sys.exit(1)
          print(f"version={version}")
          PY
          VERSION_LINE="$(python - << 'PY'
          import sys
          try:
              import tomllib
          except ModuleNotFoundError:
              import tomli as tomllib
          from pathlib import Path
          data = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          v = (data.get("project", {}) or {}).get("version")
          if not v:
              sys.exit(1)
          print(v)
          PY
          )"
          echo "version=$VERSION_LINE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.event.pull_request.merge_commit_sha }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
