name: dev-ci

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev"]

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Ruff + Pytest (Python 3.12)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: quiz_engine
          POSTGRES_USER: quiz
          POSTGRES_PASSWORD: quiz
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U quiz -d quiz_engine"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      PYTHONPATH: .
      PYTHONFAULTHANDLER: "1"
      DATABASE_URL: postgresql+psycopg://quiz:quiz@127.0.0.1:5432/quiz_engine
      PGPASSWORD: quiz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies (uv)
        run: uv sync --frozen --dev

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Python compile check
        run: uv run python -m compileall quiz_engine

      - name: Wait for PostgreSQL
        run: |
          for i in {1..30}; do
            pg_isready -h 127.0.0.1 -p 5432 -U quiz -d quiz_engine && exit 0
            sleep 2
          done
          echo "PostgreSQL did not become ready in time"
          exit 1

      - name: Apply SQL migrations
        run: |
          psql -h 127.0.0.1 -p 5432 -U quiz -d quiz_engine -v ON_ERROR_STOP=1 -f db/migrations/sql/0001_create_qe_core_tables.sql
          psql -h 127.0.0.1 -p 5432 -U quiz -d quiz_engine -v ON_ERROR_STOP=1 -f db/migrations/sql/0002_seed_service_settings.sql
          psql -h 127.0.0.1 -p 5432 -U quiz -d quiz_engine -v ON_ERROR_STOP=1 -f db/migrations/sql/0003_replace_answer_result_with_stage_event_outcome.sql

      - name: Verify SQL migration history
        run: |
          psql -h 127.0.0.1 -p 5432 -U quiz -d quiz_engine -v ON_ERROR_STOP=1 -c "SET search_path TO qe, public; SELECT version FROM qe_schema_migration ORDER BY id;"

      - name: Pytest collect-only
        run: uv run pytest --collect-only -q

      - name: Pytest
        run: uv run pytest -vv -s --durations=25 --maxfail=1
