<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rejoindre</title>
    <link rel="stylesheet" href="/static/css/main.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="kicker">Rejoindre une session</p>
        <h1>Entrez votre pseudo</h1>
      </header>
      <section class="panel">
        <form id="join-form">
          <div class="form-row">
            <label for="nickname">Pseudo</label>
            <input id="nickname" type="text" required maxlength="30" />
          </div>
          <input id="session-code" type="hidden" value="{{ session_code }}" />
          <button class="btn-primary" type="submit">Rejoindre</button>
        </form>
        <p id="join-error" class="error hidden"></p>
      </section>
    </main>
    <script src="/static/js/join.js"></script>
  </body>
</html>
