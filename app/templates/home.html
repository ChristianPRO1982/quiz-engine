<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quiz Engine</title>
    <link rel="stylesheet" href="/static/css/main.css" />
  </head>
  <body>
    <main class="page">
      <header class="hero">
        <p class="kicker">Quiz Engine</p>
        <h1>Faites jouer un quiz live en 2 minutes.</h1>
        <p class="lede">
          Créez un quiz, lancez une session, partagez le code et jouez en temps réel.
        </p>
      </header>

      <section class="panel">
        <h2>Demarrer une session</h2>
        <div class="form-row">
          <label for="quiz-id">Quiz ID (optionnel)</label>
          <input id="quiz-id" type="number" min="1" placeholder="ex: 1" />
        </div>
        <button id="start-btn" class="btn-primary">Creer un quiz demo et lancer</button>
        <div id="links" class="links hidden">
          <p>
            <span class="label">Rejoindre :</span>
            <a id="join-link" href="#">---</a>
          </p>
          <p>
            <span class="label">Host :</span>
            <a id="host-link" href="#">---</a>
          </p>
        </div>
      </section>
    </main>
    <script src="/static/js/home.js"></script>
  </body>
</html>
